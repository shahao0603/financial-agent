name: Financial Agent Daily Push

on:
  schedule:
    - cron: '0 0 * * *' # 每天台灣時間早上 8 點（UTC 0點）自動執行
  workflow_dispatch: # 允許你手動在網頁上按鈕觸發

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run bot script
        run: python bot.py
